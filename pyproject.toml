[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "misconception-aware-rag"
version = "0.3.0"
description = "Empirical AI-in-Education research bundle for wrong-answer-conditioned evidence retrieval on frozen SciQ, with a transparent misconception-aware tutoring prototype."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
dependencies = [
  "pandas>=2.2,<3",
  "pyarrow>=16,<25",
]
keywords = [
  "ai-in-education",
  "educational-retrieval",
  "wrong-answer-conditioning",
  "negative-control",
  "sciq",
  "bm25",
  "retrieval-augmented-generation",
  "misconception-aware-rag",
  "reproducible-research",
  "intelligent-tutoring",
]

[project.urls]
Repository = "https://github.com/devissaputra/misconception_aware_rag"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
