<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
<title id="title">Misconception-Aware RAG synthetic demo</title>
<desc id="desc">The demo uses twenty-four synthetic evidence passages, eight misconception records, and sixteen learner-response cases to compare generic BM25 with misconception-aware retrieval and exercise abstention and grounded response generation.</desc>
<rect width="1200" height="365" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic misconception-aware RAG demo</text>
<text x="52" y="76" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#aeb8c5">24 passages · 8 misconception records · 16 evaluation cases · synthetic only.</text>

<rect x="52" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Diagnosis stress test</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">positive vs rejection cues</text>
<text x="70" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">mentioning ≠ believing</text>

<rect x="320" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Retrieval comparison</text>
<text x="338" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">generic BM25 vs aware</text>
<text x="338" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">same labeled cases</text>

<rect x="588" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Evidence control</text>
<text x="606" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">sufficiency + abstention</text>
<text x="606" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">score breakdown visible</text>

<rect x="856" y="112" width="292" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Response generation</text>
<text x="874" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">retrieved passages + citations</text>
<text x="874" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">deterministic baseline, not LLM</text>

<text x="52" y="282" font-family="Arial" font-size="14" fill="#d1d5db">The demo prints case-level predictions, generic and aware top-k evidence, response status, and citations.</text>
<text x="52" y="309" font-family="Arial" font-size="14" fill="#d1d5db">All metrics are synthetic software diagnostics and must not be reported as learner-study results.</text>
<text x="52" y="337" font-family="Arial" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>