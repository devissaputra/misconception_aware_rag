<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Misconception-Aware RAG Tutor architecture</title>
<desc id="desc">Task question and learner response feed misconception candidate detection, misconception-conditioned BM25 retrieval and pedagogical reranking, evidence sufficiency, and deterministic citation-grounded response generation.</desc>
<rect width="1200" height="360" rx="24" fill="#f7f8fa"/>
<text x="48" y="48" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#17202a">Misconception-Aware RAG Tutor · implemented architecture</text>
<text x="48" y="76" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#59636e">Misconception evidence changes retrieval; weak evidence can stop generation.</text>

<rect x="35" y="120" width="165" height="120" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="117" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Task context</text>
<text x="117" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">question</text>
<text x="117" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">learner response</text>

<line x1="207" y1="180" x2="237" y2="180" stroke="#8391a1" stroke-width="2"/><path d="M229 174 L237 180 L229 186" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="245" y="105" width="195" height="150" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="342" y="138" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Candidate detection</text>
<text x="342" y="165" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">positive cues</text>
<text x="342" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">rejection cues</text>
<text x="342" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">possible / rejected</text>
<text x="342" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">ambiguous</text>

<line x1="448" y1="180" x2="478" y2="180" stroke="#8391a1" stroke-width="2"/><path d="M470 174 L478 180 L470 186" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="486" y="105" width="205" height="150" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="588" y="138" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Aware retrieval</text>
<text x="588" y="165" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">BM25 baseline</text>
<text x="588" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">corrective query expansion</text>
<text x="588" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">concept / evidence boosts</text>
<text x="588" y="225" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">score breakdown</text>

<line x1="699" y1="180" x2="729" y2="180" stroke="#8391a1" stroke-width="2"/><path d="M721 174 L729 180 L721 186" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="737" y="120" width="180" height="120" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="827" y="151" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Evidence gate</text>
<text x="827" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">count · top score</text>
<text x="827" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">supporting kind</text>
<text x="827" y="218" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">abstain if weak</text>

<line x1="925" y1="180" x2="955" y2="180" stroke="#8391a1" stroke-width="2"/><path d="M947 174 L955 180 L947 186" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="963" y="105" width="202" height="150" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="1064" y="138" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Grounded generation</text>
<text x="1064" y="165" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">possible-misconception wording</text>
<text x="1064" y="185" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">retrieved passages only</text>
<text x="1064" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">evidence citations</text>
<text x="1064" y="225" text-anchor="middle" font-family="Arial" font-size="12" fill="#7a8794">deterministic template, not LLM</text>

<text x="48" y="310" font-family="Arial" font-size="13" fill="#59636e">Each stage is independently inspectable and separately evaluable.</text>
</svg>