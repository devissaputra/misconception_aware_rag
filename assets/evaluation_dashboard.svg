<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Misconception-Aware RAG evaluation checklist</title>
<desc id="desc">Evaluation checklist covering misconception validity, retrieval quality, evidence sufficiency, grounding, pedagogical usefulness, and leakage control.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1B2430">Misconception-Aware RAG Tutor · evaluation checklist</text>
<text x="60" y="99" font-family="Arial,sans-serif" font-size="17" fill="#5B6660">Evaluate diagnosis, retrieval, abstention, and generation separately.</text>

<rect x="60" y="140" width="330" height="130" rx="18" fill="#E8F1F3" stroke="#87949A"/>
<text x="82" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Misconception validity</text>
<text x="82" y="203" font-family="Arial" font-size="14" fill="#26343B">Does the system distinguish stable</text>
<text x="82" y="225" font-family="Arial" font-size="14" fill="#26343B">misconception, slip, rejection, ambiguity?</text>

<rect x="435" y="140" width="330" height="130" rx="18" fill="#EEF3E8" stroke="#87949A"/>
<text x="457" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Retrieval quality</text>
<text x="457" y="203" font-family="Arial" font-size="14" fill="#26343B">Precision@k · Recall@k · MRR</text>
<text x="457" y="225" font-family="Arial" font-size="14" fill="#26343B">nDCG and evidence-type coverage</text>

<rect x="810" y="140" width="330" height="130" rx="18" fill="#F5EDE4" stroke="#87949A"/>
<text x="832" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Evidence sufficiency</text>
<text x="832" y="203" font-family="Arial" font-size="14" fill="#26343B">Does the tutor abstain when evidence</text>
<text x="832" y="225" font-family="Arial" font-size="14" fill="#26343B">is absent, weak, or inappropriate?</text>

<rect x="60" y="305" width="330" height="130" rx="18" fill="#ECE8F5" stroke="#87949A"/>
<text x="82" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Grounding</text>
<text x="82" y="368" font-family="Arial" font-size="14" fill="#26343B">Are claims supported by retrieved</text>
<text x="82" y="390" font-family="Arial" font-size="14" fill="#26343B">passages and valid citations?</text>

<rect x="435" y="305" width="330" height="130" rx="18" fill="#F4EFE8" stroke="#87949A"/>
<text x="457" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Pedagogical usefulness</text>
<text x="457" y="368" font-family="Arial" font-size="14" fill="#26343B">Does correction help reasoning without</text>
<text x="457" y="390" font-family="Arial" font-size="14" fill="#26343B">over-explaining or fixing false labels?</text>

<rect x="810" y="305" width="330" height="130" rx="18" fill="#EAF0EC" stroke="#87949A"/>
<text x="832" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Leakage control</text>
<text x="832" y="368" font-family="Arial" font-size="14" fill="#26343B">Are gold relevance labels separated</text>
<text x="832" y="390" font-family="Arial" font-size="14" fill="#26343B">from production retrieval metadata?</text>

<text x="60" y="488" font-family="Arial" font-size="15" fill="#5B6660">A good retriever cannot compensate for an invalid misconception label or an unfaithful generator.</text>
</svg>